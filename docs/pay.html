<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>담다 크레딧 결제</title>
<!-- 담다 크레딧 카드 결제 페이지. 앱이 팀 서버(payStart)에서 받은 주소로 이 페이지를 열고,
     토스페이먼츠 결제창을 띄운다. 결제가 끝나면 토스가 successUrl(팀 서버)로 보내고, 팀 서버가 승인·충전한다.
     이 페이지에는 비밀 키가 없다. 클라이언트 키는 공개돼도 되는 키다. -->
<script src="https://js.tosspayments.com/v2/standard"></script>
<style>
  body { margin: 0; font-family: "Pretendard", "Malgun Gothic", system-ui, sans-serif; background: #f8f4ec; color: #2b2520; }
  .box { max-width: 460px; margin: 48px auto; background: #fff; border: 1px solid #e7dfd2; border-radius: 16px; padding: 28px 26px; }
  h1 { font-size: 22px; margin: 0 0 6px; }
  .sub { color: #7a7067; font-size: 14px; margin: 0 0 18px; }
  .row { display: flex; justify-content: space-between; padding: 10px 0; border-top: 1px solid #f0e9dd; font-size: 16px; }
  .row strong { font-size: 18px; }
  button { width: 100%; margin-top: 18px; padding: 14px; font-size: 18px; font-weight: 700; color: #fff; background: #c2410c; border: 0; border-radius: 12px; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  .test { background: #fff7e0; border: 1px solid #f1d58a; border-radius: 10px; padding: 10px 12px; font-size: 14px; margin-top: 14px; }
  .err { color: #b42318; font-size: 14px; margin-top: 12px; white-space: pre-wrap; }
</style>
</head>
<body>
<div class="box">
  <h1>담다 크레딧 사기</h1>
  <p class="sub" id="who"></p>
  <div class="row"><span>크레딧</span><strong id="credits"></strong></div>
  <div class="row"><span>결제 금액</span><strong id="amount"></strong></div>
  <div class="row"><span>주문번호</span><span id="orderId" style="font-size:13px;color:#7a7067"></span></div>
  <button id="pay" type="button">카드로 결제하기</button>
  <div class="test" id="test" hidden>지금은 <b>테스트 결제</b>예요. 실제 돈은 빠지지 않아요. 카드 번호는 아무 테스트 카드나 돼요.</div>
  <p class="err" id="err"></p>
  <p class="sub" style="margin-top:18px">결제가 끝나면 담다로 돌아가세요. 잔액이 자동으로 바뀌어요.</p>
</div>
<script>
  var q = new URLSearchParams(location.search);
  var ck = q.get("ck") || "";
  var orderId = q.get("orderId") || "";
  var amount = Number(q.get("amount") || 0);
  var credits = Number(q.get("credits") || 0);
  var customer = q.get("customer") || "";
  var customerKey = q.get("customerKey") || "";
  var successUrl = q.get("successUrl") || "";
  var failUrl = q.get("failUrl") || "";
  var won = function (n) { return n.toLocaleString("ko-KR") + "원"; };

  document.getElementById("who").textContent = customer ? customer + " 님" : "";
  document.getElementById("credits").textContent = credits.toLocaleString("ko-KR") + "크레딧";
  document.getElementById("amount").textContent = won(amount);
  document.getElementById("orderId").textContent = orderId;
  if (ck.indexOf("test_") === 0) document.getElementById("test").hidden = false;

  var btn = document.getElementById("pay");
  var err = document.getElementById("err");
  if (!ck || !orderId || !amount || !successUrl) {
    btn.disabled = true;
    err.textContent = "결제 정보가 빠졌어요. 담다에서 다시 '카드로 사기'를 눌러 주세요.";
  }

  btn.addEventListener("click", async function () {
    btn.disabled = true;
    err.textContent = "";
    try {
      var tossPayments = TossPayments(ck);
      var payment = tossPayments.payment({ customerKey: customerKey || TossPayments.ANONYMOUS });
      await payment.requestPayment({
        method: "CARD",
        amount: { currency: "KRW", value: amount },
        orderId: orderId,
        orderName: "담다 크레딧 " + credits.toLocaleString("ko-KR"),
        successUrl: successUrl,
        failUrl: failUrl,
        customerName: customer || undefined,
        card: { useEscrow: false, flowMode: "DEFAULT", useCardPoint: false, useAppCardOnly: false }
      });
    } catch (e) {
      btn.disabled = false;
      err.textContent = (e && e.message) ? e.message : String(e);
    }
  });
</script>
</body>
</html>
